# Yarn Berry config.
# - node-modules linker for compatibility with Astro/Vite tooling (no PnP).
# - No zero-installs: .yarn/cache is gitignored.
nodeLinker: node-modules

packageExtensions:
  # Upstream bug: @astrojs/astro2tsx (used by `astro check`) depends on
  # @napi-rs/wasm-runtime but does not provide its @emnapi/runtime peer.
  # Pinned to the version npm hoisted in package-lock.json.
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "1.11.3"
  # Upstream bug: @astrojs/language-server depends on @volar/kit but does not
  # forward its typescript peer (provided by the root via @astrojs/check).
  "@astrojs/language-server@*":
    peerDependencies:
      typescript: "*"
  # Same omission in the wasm32-wasi fallback binding of the Astro compiler
  # (installed only on wasm32 hosts; declared so installs stay warning-free).
  "@astrojs/compiler-binding-wasm32-wasi@*":
    dependencies:
      "@emnapi/core": "1.11.3"
      "@emnapi/runtime": "1.11.3"
